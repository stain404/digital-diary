# Publishes the book to GitHub Pages.
# Works with Settings -> Pages -> Source = "GitHub Actions".
# (If Source is set to a branch instead, Pages serves the repo root
# directly and this workflow simply isn't used — either way the book
# lands at the bare Pages URL.)
name: Deploy the scrapbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # Copy just the site itself, so .git and the workflow never ship.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js content.js robots.txt .nojekyll _site/
          cp -r images _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
